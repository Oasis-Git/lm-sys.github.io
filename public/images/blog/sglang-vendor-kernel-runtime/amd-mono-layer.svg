<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">One DeepSeek-V4.1 layer at batch size 1: standard path vs. Low-Latency Mode</title>
<desc id="desc">Schematic timeline of one decoder layer on one GPU. The standard path runs dozens of small kernels with an idle gap at every boundary and two all-reduces that stop computation. Low-Latency Mode runs the layer as two FlyDSL launches, K1 and K2: weights load while earlier stages compute, and partial sums go to peer GPUs while computation continues. On index layers, SGLang's compressor, K2i and top-k run between the launches.</desc>
